{% extends "base.html" %}

{% block title %}Editar Habitación{% endblock %}

{% block content %}
<div class="page-header">
    <h1>
        <i class="fas fa-edit"></i>
        Editar Habitación
    </h1>
</div>

<div class="row justify-content-center">
    <div class="col-12 col-md-8">
        <div class="card">
            <div class="card-body">
                <form method="POST">
                    <div class="row">
                        <div class="col-12 col-md-6 mb-3">
                            <label class="form-label">Número de Habitación</label>
                            <input type="text" class="form-control" name="room_number" value="{{ room.room_number }}" required>
                        </div>
                        <div class="col-12 col-md-6 mb-3">
                            <label class="form-label">Tipo</label>
                            <select class="form-select" name="room_type" required>
                                <option value="individual" {% if room.room_type == 'individual' %}selected{% endif %}>Individual</option>
                                <option value="doble" {% if room.room_type == 'doble' %}selected{% endif %}>Doble</option>
                                <option value="suite" {% if room.room_type == 'suite' %}selected{% endif %}>Suite</option>
                                <option value="penthouse" {% if room.room_type == 'penthouse' %}selected{% endif %}>Penthouse</option>
                            </select>
                        </div>
                    </div>
                    <div class="row">
                        <div class="col-12 col-md-6 mb-3">
                            <label class="form-label">Capacidad (personas)</label>
                            <input type="number" class="form-control" name="capacity" value="{{ room.capacity }}" min="1" required>
                        </div>
                        <div class="col-12 col-md-6 mb-3">
                            <label class="form-label">Precio por Noche</label>
                            <input type="number" class="form-control" name="price_per_night" value="{{ room.price_per_night }}" step="0.01" required>
                        </div>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Descripción</label>
                        <textarea class="form-control" name="description" rows="4">{{ room.description or '' }}</textarea>
                    </div>
                    <div class="d-grid gap-2 d-md-flex justify-content-md-end">
                        <a href="/rooms/{{ room.id }}" class="btn btn-secondary">
                            <i class="fas fa-arrow-left"></i>
                            Cancelar
                        </a>
                        <button type="submit" class="btn btn-success">
                            <i class="fas fa-save"></i>
                            Guardar Cambios
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
